[build-system]
# hatchling 1.28+ requires Python 3.10. Keep the build backend installable on 3.8.
requires = ["hatchling>=1.18.0,<1.28"]
build-backend = "hatchling.build"

[project]
name = "recipe-book"
version = "0.1.0"
description = "Local CLI to save recipes, search them, and build a shopping list."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
# Upper bounds apply only where a current release no longer supports that Python.
dependencies = [
  "click>=8.0.0,<8.2; python_version < '3.10'",
  "click>=8.0.0; python_version >= '3.10'",
  "rich>=13.0.0,<15; python_version < '3.9'",
  "rich>=13.0.0; python_version >= '3.9'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<8.4; python_version < '3.9'",
  "pytest>=7.0,<9; python_version >= '3.9' and python_version < '3.10'",
  "pytest>=7.0; python_version >= '3.10'",
  "ruff>=0.6.0",
]

[project.scripts]
recipe-book = "recipe_book.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/recipe-book"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "A"]

[tool.ruff.lint.isort]
known-first-party = ["recipe_book"]
