[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-book"
version = "0.1.0"
description = "A recipe management CLI with meal planning and shopping lists."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
recipe-book = "recipe_book.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/recipe-book"
